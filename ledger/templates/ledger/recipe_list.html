{% extends 'ledger/base.html' %}

{% block page_title %}Recipe List{% endblock %}

{% block content %}
<ul>
    {% for recipe in object_list %}
        <li>
            <a href = "{% url 'recipe_detail' recipe.id %}">{{recipe.name}}</a>
        </li>
    {% endfor %}
</ul>
<a href="{% url 'recipe_add' %}">Add Recipe</a>
{% endblock %}
